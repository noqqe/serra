version: 2
before:
  hooks:
    - go mod tidy
    - go generate ./...
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - openbsd
    ldflags:
      - -X github.com/noqqe/serra/pkg/serra.Version={{.Tag}}
    flags:
      - -v
    main: ./cmd/serra
archives:
  - id: serra
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
homebrew_casks:
  - name: serra
    repository:
      owner: noqqe
      name: homebrew-tap
    directory: Casks
    commit_author:
      name: goreleaserbot
      email: goreleaser@carlosbecker.com
    homepage: "https://github.com/noqqe/serra"
    description: "serra - Personal Magic: The Gathering Collection Tracker"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/serra"]
          end
